name: Build SpearVPN Windows Client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.27.0-spear)'
        required: false
        default: 'v1.27.0-spear'

permissions:
  contents: write

jobs:
  Build-Frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build-only
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  Build-Windows:
    needs: Build-Frontend
    runs-on: windows-latest
    env:
      APP_NAME: GUI.for.SingBox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build & Pack Windows x64
        shell: pwsh
        run: |
          $arch = "amd64"
          $env:GOOS = "windows"
          $env:GOARCH = $arch

          Write-Host "==> Building Windows $arch..."
          ~/go/bin/wails build -m -s -trimpath -skipbindings -devtools -o "$env:APP_NAME.exe"

          Write-Host "==> Pre-bundling official sing-box core into data/sing-box..."
          New-Item -ItemType Directory -Force -Path "build/bin/data/sing-box"

          $coreUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-windows-amd64.zip"
          Invoke-WebRequest -Uri $coreUrl -OutFile "build/bin/sing-box-core.zip"
          Expand-Archive -Path "build/bin/sing-box-core.zip" -DestinationPath "build/bin/sing-box-core-temp" -Force

          Get-ChildItem -Path "build/bin/sing-box-core-temp" -Recurse -Filter "sing-box.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination "build/bin/data/sing-box/sing-box.exe" -Force
          }
          Get-ChildItem -Path "build/bin/sing-box-core-temp" -Recurse -Filter "libcronet.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination "build/bin/data/sing-box/libcronet.dll" -Force
          }

          Remove-Item "build/bin/sing-box-core.zip" -Force
          Remove-Item "build/bin/sing-box-core-temp" -Recurse -Force

          Write-Host "==> Packaging release archives..."
          Push-Location build/bin
          Compress-Archive -Path "$env:APP_NAME.exe", "data" -DestinationPath "$env:APP_NAME-windows-$arch.zip" -Force
          Copy-Item "$env:APP_NAME-windows-$arch.zip" -Destination "SpearVPN-Windows-x64.zip" -Force
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: build/bin/*.zip

  Release:
    needs: [Build-Windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-assets/**/*.zip
          draft: false
          prerelease: false
          body: |
            ### SpearVPN Windows Client (Pre-configured GUI.for.SingBox)
            - **Architecture:** Windows x64 (AMD64)
            - **Pre-bundled Core:** Official SagerNet/sing-box 1.14.2 (`data/sing-box/sing-box.exe`)
            - **TUN Mode:** Enabled by default on initial launch
            - **Subscription Preset:** Native Sing-Box format (`User-Agent: sing-box`)
            - **Privileges:** Administrator UAC elevation manifest embedded
